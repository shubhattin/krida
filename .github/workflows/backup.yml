name: Data Backup

on:
  schedule:
    - cron: '30 17 */4 * *' # 11:00 PM IST every 4th day of the month (1st, 5th, 9th, ...)
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  backup_db_data:
    runs-on: ubuntu-latest
    environment: backup
    steps:
      # Third-party actions are pinned to full commit SHAs (tag kept in the comment) so a
      # moved tag cannot run new code in this job. Secrets are scoped to the last step only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # --ignore-scripts skips the root `prepare` hook (clones Effect-TS docs; not needed here)
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL 18 client
        # pg_dump must be >= the server major (PlanetScale runs 18). Installed from the official
        # PGDG apt repo; tj-actions/install-postgresql only supports up to 17.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Verify pg_dump version
        run: pg_dump --version | grep -E ' 18\.'

      - name: Load Data and DB Dump
        working-directory: src/db/scripts
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          # libpq (pg_dump) CA for sslmode=verify-full; env only — postgres.js rejects it in the URL
          PGSSLROOTCERT: system
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DB_BACKUP_BUCKET_NAME: ${{ secrets.AWS_DB_BACKUP_BUCKET_NAME }}
        # The secret is a bare URL: require TLS with certificate verification for both pg_dump
        # (libpq, CA from PGSSLROOTCERT) and postgres.js (Node's CA store) unless it sets sslmode.
        run: |
          case "$PG_DATABASE_URL" in
            *sslmode=*) ;;
            *\?*) PG_DATABASE_URL="$PG_DATABASE_URL&sslmode=verify-full" ;;
            *) PG_DATABASE_URL="$PG_DATABASE_URL?sslmode=verify-full" ;;
          esac
          export PG_DATABASE_URL
          bun backup_db_data.ts
