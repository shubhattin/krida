name: Data Backup

on:
  schedule:
    - cron: '30 17 */4 * *' # Run at 11:00 PM IST every 3 days
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  backup_db_data:
    runs-on: ubuntu-latest
    env:
      PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DB_BACKUP_BUCKET_NAME: ${{ secrets.AWS_DB_BACKUP_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install pg_dump and zip
        run: sudo apt-get update && sudo apt-get install -y postgresql-client zip

      - name: Load Data and DB Dump
        working-directory: src/db/scripts
        run: bun backup_db_data.ts
